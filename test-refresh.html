<!DOCTYPE html>
<html>
<head>
    <title>Test Refresh Token</title>
</head>
<body>
    <h1>Test Refresh Token</h1>
    <input type="text" id="token" placeholder="Enter your token here" size="50">
    <button onclick="testRefreshToken()">Test Refresh Token</button>
    <div id="result"></div>

    <script>
        async function testRefreshToken() {
            const token = document.getElementById('token').value;
            const resultDiv = document.getElementById('result');
            
            if (!token) {
                resultDiv.innerHTML = '<p style="color: red;">Please enter a token</p>';
                return;
            }
            
            try {
                resultDiv.innerHTML = '<p>Sending request...</p>';
                
                const response = await fetch('http://localhost:4000/api/refresh-token', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    },
                });
                
                const text = await response.text();
                
                resultDiv.innerHTML = `
                    <h2>Response</h2>
                    <p>Status: ${response.status} ${response.statusText}</p>
                    <p>Headers: ${JSON.stringify([...response.headers.entries()])}</p>
                    <pre>${text}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
